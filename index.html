<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sloppy Joe Slop Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            background-size: 400% 400%;
            animation: gradientShift 4s ease infinite;
            overflow: hidden;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            height: 100vh;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            text-align: center;
            z-index: 1000;
        }

        .start-button {
            padding: 20px 40px;
            font-size: 24px;
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .start-button:hover {
            transform: scale(1.1);
        }

        .title {
            font-size: 48px;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .sloppy-joe {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .sloppy-joe:hover {
            transform: scale(1.2);
        }

        .hidden {
            display: none;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div class="start-screen" id="startScreen">
        <h1 class="title"> SLOPPY JOE SLOP </h1>
        <p style="font-size: 18px; margin-bottom: 30px;">Get ready for the ultimate sloppy joe experience!</p>
        <button class="start-button" id="startButton">START THE SLOP</button>
    </div>

    <div class="loading hidden" id="loading">Generating Sloppy Joes... </div>

    <audio id="backgroundMusic" loop>
        <source src="/api - oh oh sloppy joe - Sonauto.ogg" type="audio/ogg">
    </audio>

    <script>
        class SloppyJoeExperience {
            constructor() {
                this.sloppyJoes = [];
                this.isRunning = false;
                this.generationCount = 0;
                this.maxSloppyJoes = 12;
                this.audioContext = null;
                this.analyser = null;
                this.dataArray = null;
                
                this.init();
            }

            init() {
                const startButton = document.getElementById('startButton');
                const music = document.getElementById('backgroundMusic');
                
                startButton.addEventListener('click', async () => {
                    document.getElementById('startScreen').classList.add('hidden');
                    document.getElementById('loading').classList.remove('hidden');
                    
                    if (this.audioContext && this.audioContext.state === 'suspended') {
                        await this.audioContext.resume();
                    }

                    // Start music and setup audio analysis
                    try {
                        if (!this.audioContext) { // Setup audio context only if not already done
                            this.setupAudioAnalysis(music);
                        }
                        await music.play();
                    } catch (e) {
                        console.log('Music autoplay blocked or setup failed:', e);
                        // Attempt to setup audio context on interaction if it failed before music play
                        if (!this.audioContext) {
                           try {
                               this.setupAudioAnalysis(music);
                           } catch (setupError) {
                                console.error('Audio context setup failed on interaction:', setupError);
                           }
                        }
                    }
                    
                    this.startExperience();
                });
            }

            setupAudioAnalysis(audioElement) {
                // Ensure AudioContext is only initialized once
                if (this.audioContext) return;

                try {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    this.analyser = this.audioContext.createAnalyser();
                    const source = this.audioContext.createMediaElementSource(audioElement);
                    
                    source.connect(this.analyser);
                    this.analyser.connect(this.audioContext.destination);
                    
                    this.analyser.fftSize = 256; // Lower FFT size for broader frequency bins, good for general levels
                    const bufferLength = this.analyser.frequencyBinCount; // Will be 128
                    this.dataArray = new Uint8Array(bufferLength);
                } catch (e) {
                    console.log('Audio analysis setup failed:', e);
                    this.audioContext = null; // Reset if setup failed
                }
            }

            async startExperience() {
                this.isRunning = true;
                document.getElementById('loading').classList.add('hidden');
                
                // Generate initial batch of sloppy joes
                for (let i = 0; i < 5; i++) {
                    await this.generateSloppyJoe();
                }
                
                // Continue generating more periodically
                setInterval(() => {
                    if (this.sloppyJoes.length < this.maxSloppyJoes) {
                        this.generateSloppyJoe();
                    }
                }, 1500);
                
                this.animate();
            }

            getAudioLevel() { // General audio level
                if (!this.analyser || !this.dataArray || !this.audioContext || this.audioContext.state === 'suspended') return 0;
                
                this.analyser.getByteFrequencyData(this.dataArray);
                
                let sum = 0;
                for (let i = 0; i < this.dataArray.length; i++) {
                    sum += this.dataArray[i];
                }
                return sum / this.dataArray.length / 255; // Normalize to 0-1
            }

            getBassLevel() { // Specific bass frequency level
                if (!this.analyser || !this.dataArray || !this.audioContext || this.audioContext.state === 'suspended') return 0;

                this.analyser.getByteFrequencyData(this.dataArray); // Ensure data is current

                let bassSum = 0;
                // Lower frequencies are at the start of the dataArray.
                // For fftSize = 256, frequencyBinCount = 128.
                // Each bin is approx sampleRate/256 Hz.
                // e.g., if sampleRate is 44100Hz, each bin is ~172Hz.
                // We'll take the first 3 bins for bass (0Hz to ~516Hz)
                const bassBinCount = 3; 
                for (let i = 0; i < bassBinCount && i < this.dataArray.length; i++) {
                    bassSum += this.dataArray[i];
                }
                // Average of the bass bins, normalized to 0-1
                return (bassSum / bassBinCount) / 255; 
            }

            async generateSloppyJoe() {
                try {
                    const prompts = [
                        "a delicious sloppy joe sandwich with meat sauce dripping",
                        "a messy sloppy joe burger with sauce everywhere",
                        "a gooey sloppy joe with ground beef and tomato sauce",
                        "a juicy sloppy joe sandwich with pickles on top",
                        "a classic sloppy joe with sauce dripping down",
                        "a cartoon sloppy joe sandwich with a happy face",
                        "a realistic sloppy joe with sesame seed bun"
                    ];
                    
                    const randomPrompt = prompts[Math.floor(Math.random() * prompts.length)];
                    
                    const result = await websim.imageGen({
                        prompt: randomPrompt,
                        aspect_ratio: "1:1",
                        transparent: true
                    });

                    this.createBouncingSloppyJoe(result.url);
                } catch (error) {
                    console.error('Failed to generate sloppy joe:', error);
                }
            }

            createBouncingSloppyJoe(imageUrl) {
                const sloppyJoe = document.createElement('img');
                sloppyJoe.src = imageUrl;
                sloppyJoe.className = 'sloppy-joe';
                
                // Random starting position
                const x = Math.random() * (window.innerWidth - 80);
                const y = Math.random() * (window.innerHeight - 80);
                
                sloppyJoe.style.left = x + 'px';
                sloppyJoe.style.top = y + 'px';
                
                // Random initial velocity using angle and speed for more uniform direction
                const angle = Math.random() * 2 * Math.PI; // Random angle in radians
                const speed = Math.random() * 3 + 2; // Random speed between 2 and 5 ( (max-min) + min )
                
                const velocity = {
                    x: Math.cos(angle) * speed,
                    y: Math.sin(angle) * speed
                };
                
                // Random rotation speed
                const rotationSpeed = (Math.random() - 0.5) * 4;
                let rotation = 0;
                
                const sloppyJoeData = {
                    element: sloppyJoe,
                    x: x,
                    y: y,
                    velocity: velocity,
                    rotation: rotation,
                    rotationSpeed: rotationSpeed
                };
                
                this.sloppyJoes.push(sloppyJoeData);
                document.body.appendChild(sloppyJoe);
                
                // Click handler for extra bounce
                sloppyJoe.addEventListener('click', () => {
                    sloppyJoeData.velocity.x += (Math.random() - 0.5) * 10;
                    sloppyJoeData.velocity.y += (Math.random() - 0.5) * 10;
                    sloppyJoe.style.transform = `scale(1.5) rotate(${rotation}deg)`;
                    setTimeout(() => {
                        sloppyJoe.style.transform = `scale(1) rotate(${rotation}deg)`;
                    }, 200);
                });
            }

            animate() {
                if (!this.isRunning) return;
                
                const audioLevel = this.getAudioLevel();
                const bassLevel = this.getBassLevel(); // Get current bass level
                const beatMultiplier = 1 + (audioLevel * 1.5); // Reduced from 2 to 1.5
                
                this.sloppyJoes.forEach(sloppy => {
                    // Update position
                    sloppy.x += sloppy.velocity.x * beatMultiplier;
                    sloppy.y += sloppy.velocity.y * beatMultiplier;
                    
                    // Bounce off walls
                    if (sloppy.x <= 0 || sloppy.x >= window.innerWidth - 80) {
                        sloppy.velocity.x *= -0.8; // Dampen horizontal bounce
                        sloppy.x = Math.max(0, Math.min(window.innerWidth - 80, sloppy.x));
                    }
                    
                    // Ground collision (bottom of screen)
                    if (sloppy.y >= window.innerHeight - 80) {
                        sloppy.y = window.innerHeight - 80; // Pin to ground
                        sloppy.velocity.y *= -0.7; // Basic dampen and reverse for ground bounce

                        // Bass Kick Effect: Add extra upward velocity based on bass level
                        const bassBoostFactor = 10; // Reduced from 20 to 10
                        sloppy.velocity.y -= bassLevel * bassBoostFactor; 
                                            // Subtract because positive y is downwards, negative y is upwards

                    } else if (sloppy.y <= 0) { // Ceiling collision
                        sloppy.velocity.y *= -0.8; // Dampen ceiling bounce
                        sloppy.y = 0;
                    }
                    
                    // Update rotation with beat sync
                    sloppy.rotation += sloppy.rotationSpeed * beatMultiplier;
                    
                    // Apply transforms with beat-responsive scaling
                    const beatScale = 1 + (audioLevel * 0.3);
                    sloppy.element.style.left = sloppy.x + 'px';
                    sloppy.element.style.top = sloppy.y + 'px';
                    sloppy.element.style.transform = `rotate(${sloppy.rotation}deg) scale(${beatScale})`;
                    
                    // Add some gravity with beat response
                    // Ensure gravity doesn't overpower upward bass kick immediately
                    if (sloppy.y < window.innerHeight - 80) {
                         sloppy.velocity.y += 0.1 * beatMultiplier;
                    }

                    // Add some friction
                    sloppy.velocity.x *= 0.999;
                    if (Math.abs(sloppy.velocity.y) > 0.1) { // Only apply y-friction if moving vertically
                        sloppy.velocity.y *= 0.999;
                    }
                });
                
                requestAnimationFrame(() => this.animate());
            }
        }

        // Start the experience when page loads
        window.addEventListener('load', () => {
            new SloppyJoeExperience();
        });
    </script>

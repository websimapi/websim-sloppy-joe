<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sloppy Joe Slop Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            background-size: 400% 400%;
            animation: gradientShift 4s ease infinite;
            overflow: hidden;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            height: 100vh;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            text-align: center;
            z-index: 1000;
        }

        .start-button {
            padding: 20px 40px;
            font-size: 24px;
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .start-button:hover {
            transform: scale(1.1);
        }

        .title {
            font-size: 48px;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .sloppy-joe {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.5s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 10; /* Ensure sloppy joes are above particles */
        }

        .sloppy-joe:hover {
            transform: scale(1.2);
        }

        .hidden {
            display: none;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div class="start-screen" id="startScreen">
        <h1 class="title"> SLOPPY JOE SLOP </h1>
        <p style="font-size: 18px; margin-bottom: 30px;">Get ready for the ultimate sloppy joe experience!</p>
        <button class="start-button" id="startButton">START THE SLOP</button>
    </div>

    <div class="loading hidden" id="loading">Generating Sloppy Joes... </div>

    <audio id="backgroundMusic" loop>
        <source src="/api - oh oh sloppy joe - Sonauto.ogg" type="audio/ogg">
    </audio>

    <script>
        class Particle {
            constructor(x, y, vx, vy, size, color, lifespan) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.size = size;
                this.lifespan = lifespan;
                this.age = 0;

                this.element = document.createElement('div');
                this.element.style.position = 'absolute';
                this.element.style.width = `${size}px`;
                this.element.style.height = `${size}px`;
                this.element.style.backgroundColor = color;
                this.element.style.borderRadius = '50%';
                this.element.style.left = `${this.x - size / 2}px`; // Center particle
                this.element.style.top = `${this.y - size / 2}px`;  // Center particle
                this.element.style.zIndex = '5'; // Below sloppy joes
                this.element.style.pointerEvents = 'none';

                document.body.appendChild(this.element);
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.15; // Gravity for particles

                this.age++;
                const opacity = 1 - (this.age / this.lifespan);
                this.element.style.opacity = Math.max(0, opacity);
                
                // Shrink particle slightly over time for a "dissipating" effect
                const currentSize = this.size * (1 - (this.age / (this.lifespan * 1.5)));
                if (currentSize > 0) {
                    this.element.style.width = `${currentSize}px`;
                    this.element.style.height = `${currentSize}px`;
                }


                this.element.style.transform = `translate(${this.x - (currentSize > 0 ? currentSize/2 : this.size/2)}px, ${this.y - (currentSize > 0 ? currentSize/2 : this.size/2)}px)`;
                // Use translate for positioning for potentially smoother animation
                this.element.style.left = '0px'; 
                this.element.style.top = '0px';


                return this.age >= this.lifespan || this.y > window.innerHeight + this.size; // True if dead
            }

            remove() {
                if (this.element.parentElement) {
                    this.element.parentElement.removeChild(this.element);
                }
            }
        }

        class SloppyJoeExperience {
            constructor() {
                this.sloppyJoes = [];
                this.particles = []; // For particle effects
                this.isRunning = false;
                this.generationCount = 0;
                this.maxSloppyJoes = 12;
                this.audioContext = null;
                this.analyser = null;
                this.dataArray = null;
                this.musicStartTime = 0;
                this.rainbowEffectActive = false;
                this.rainbowHueAngle = 0;

                // Physics & Behavior Constants
                this.MAX_BOUNCE_POTENTIAL = 60; // Max potential a slop can accumulate
                this.POTENTIAL_SCALE_FACTOR = 0.20; // Visual size increase (e.g., 0.2 = 20% bigger at max potential)
                this.GRAVITY_BASE = 0.15;
                this.POTENTIAL_GRAVITY_REDUCTION_FACTOR = 0.0020; // How much potential reduces gravity
                this.MIN_GRAVITY = 0.02;
                this.IMPACT_POTENTIAL_GAIN_VELOCITY_FACTOR = 0.20; // Gain from impact speed
                this.IMPACT_POTENTIAL_GAIN_BASS_FACTOR = 1.8;      // Gain from bass level
                this.RESTITUTION_GROUND = 0.55; // Base bounciness off ground
                this.BOOST_FROM_POTENTIAL_FACTOR = 0.12; // How much potential adds to bounce height
                this.BASS_BOOST_GROUND_BASE = 0.8;
                this.BASS_BOOST_GROUND_POTENTIAL_FACTOR = 0.025;
                this.AIRBORNE_POTENTIAL_DECAY = 0.9985; // Multiplicative decay per frame in air
                this.RESTING_POTENTIAL_DECAY = 0.99;  // Multiplicative decay per frame if resting
                this.WALL_HIT_POTENTIAL_DECAY_FACTOR = 0.95; // Multiplicative decay on wall hit
                this.CEILING_HIT_POTENTIAL_DECAY_FACTOR = 0.85; // Multiplicative decay on ceiling hit
                
                this.init();
            }

            init() {
                const startButton = document.getElementById('startButton');
                const music = document.getElementById('backgroundMusic');
                
                startButton.addEventListener('click', async () => {
                    document.getElementById('startScreen').classList.add('hidden');
                    document.getElementById('loading').classList.remove('hidden');
                    
                    if (this.audioContext && this.audioContext.state === 'suspended') {
                        await this.audioContext.resume();
                    }

                    try {
                        if (!this.audioContext) { 
                            this.setupAudioAnalysis(music);
                        }
                        await music.play();
                        this.musicStartTime = Date.now(); 
                    } catch (e) {
                        console.log('Music autoplay blocked or setup failed:', e);
                        if (!this.audioContext) {
                           try {
                               this.setupAudioAnalysis(music);
                           } catch (setupError) {
                                console.error('Audio context setup failed on interaction:', setupError);
                           }
                        }
                    }
                    
                    this.startExperience();
                });
            }

            setupAudioAnalysis(audioElement) {
                if (this.audioContext) return;
                try {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    this.analyser = this.audioContext.createAnalyser();
                    const source = this.audioContext.createMediaElementSource(audioElement);
                    source.connect(this.analyser);
                    this.analyser.connect(this.audioContext.destination);
                    this.analyser.fftSize = 256; 
                    const bufferLength = this.analyser.frequencyBinCount; 
                    this.dataArray = new Uint8Array(bufferLength);
                } catch (e) {
                    console.log('Audio analysis setup failed:', e);
                    this.audioContext = null; 
                }
            }

            async startExperience() {
                this.isRunning = true;
                document.getElementById('loading').classList.add('hidden');
                for (let i = 0; i < 5; i++) {
                    await this.generateSloppyJoe();
                }
                setInterval(() => {
                    if (this.sloppyJoes.length < this.maxSloppyJoes) {
                        this.generateSloppyJoe();
                    }
                }, 1500);
                this.animate();
            }

            getAudioLevel() { 
                if (!this.analyser || !this.dataArray || !this.audioContext || this.audioContext.state === 'suspended') return 0;
                this.analyser.getByteFrequencyData(this.dataArray);
                let sum = 0;
                for (let i = 0; i < this.dataArray.length; i++) {
                    sum += this.dataArray[i];
                }
                return sum / this.dataArray.length / 255; 
            }

            getBassLevel() { 
                if (!this.analyser || !this.dataArray || !this.audioContext || this.audioContext.state === 'suspended') return 0;
                this.analyser.getByteFrequencyData(this.dataArray); 
                let bassSum = 0;
                const bassBinCount = Math.max(1, Math.floor(this.dataArray.length * 0.1)); // Use lower 10% of frequencies for bass
                for (let i = 0; i < bassBinCount; i++) {
                    bassSum += this.dataArray[i];
                }
                return (bassSum / bassBinCount) / 255; 
            }

            async generateSloppyJoe() {
                try {
                    const prompts = [
                        "a delicious sloppy joe sandwich with meat sauce dripping",
                        "a messy sloppy joe burger with sauce everywhere",
                        "a gooey sloppy joe with ground beef and tomato sauce",
                        "a juicy sloppy joe sandwich with pickles on top",
                        "a classic sloppy joe with sauce dripping down",
                        "a cartoon sloppy joe sandwich with a happy face",
                        "a realistic sloppy joe with sesame seed bun"
                    ];
                    const randomPrompt = prompts[Math.floor(Math.random() * prompts.length)];
                    const result = await websim.imageGen({
                        prompt: randomPrompt,
                        aspect_ratio: "1:1",
                        transparent: true
                    });
                    this.createBouncingSloppyJoe(result.url);
                } catch (error) {
                    console.error('Failed to generate sloppy joe:', error);
                }
            }

            createBouncingSloppyJoe(imageUrl) {
                const sloppyJoe = document.createElement('img');
                sloppyJoe.src = imageUrl;
                sloppyJoe.className = 'sloppy-joe';

                // Start on the ground with a random horizontal position and an initial upward pop
                const x = Math.random() * (window.innerWidth - 80);
                const y = window.innerHeight - 80; // Start on the ground
                sloppyJoe.style.left = x + 'px';
                sloppyJoe.style.top = y + 'px';

                const initialUpwardVelocity = -(Math.random() * 2.5 + 2.0); // Initial pop upwards
                const initialHorizontalVelocity = (Math.random() - 0.5) * 3;
                const velocity = { x: initialHorizontalVelocity, y: initialUpwardVelocity };
                
                const rotationSpeed = (Math.random() - 0.5) * 4;
                let rotation = 0;
                
                const sloppyJoeData = {
                    element: sloppyJoe, x: x, y: y, velocity: velocity,
                    rotation: rotation, rotationSpeed: rotationSpeed,
                    creationTime: Date.now(),
                    bouncePotential: 0, // Initialize bounce potential
                    onGround: true      // Starts on the ground
                };
                
                this.sloppyJoes.push(sloppyJoeData);
                document.body.appendChild(sloppyJoe);
                
                sloppyJoe.addEventListener('click', () => {
                    sloppyJoeData.velocity.x += (Math.random() - 0.5) * 10;
                    sloppyJoeData.velocity.y += (Math.random() - 0.5) * 10;
                    // Keep current rotation and potential scale effect on click interaction
                    const currentScale = sloppyJoe.style.transform.match(/scale\(([^)]+)\)/);
                    const baseScaleValue = currentScale ? parseFloat(currentScale[1]) : 1;
                    sloppyJoe.style.transform = `scale(${baseScaleValue * 1.2}) rotate(${sloppyJoeData.rotation}deg)`;
                    setTimeout(() => {
                         sloppyJoe.style.transform = `scale(${baseScaleValue}) rotate(${sloppyJoeData.rotation}deg)`;
                    }, 200);
                });
            }

            animate() {
                if (!this.isRunning) return;
                
                const audioLevel = this.getAudioLevel();
                const bassLevel = this.getBassLevel(); 
                const beatMultiplier = 1 + (audioLevel * 1.5); 
                
                const music = document.getElementById('backgroundMusic');
                if (music.currentTime >= 45 && !this.rainbowEffectActive) {
                    this.rainbowEffectActive = true;
                }
                if (this.rainbowEffectActive) {
                    this.rainbowHueAngle = (this.rainbowHueAngle + 1) % 360; 
                }

                this.particles = this.particles.filter(particle => {
                    if (particle.update()) {
                        particle.remove();
                        return false;
                    }
                    return true;
                });
                
                this.sloppyJoes.forEach(sloppy => {
                    const vy_before_physics_update = sloppy.velocity.y;

                    // 1. Apply forces (gravity)
                    if (!sloppy.onGround) {
                        let currentGravity = this.GRAVITY_BASE;
                        currentGravity -= sloppy.bouncePotential * this.POTENTIAL_GRAVITY_REDUCTION_FACTOR;
                        currentGravity = Math.max(this.MIN_GRAVITY, currentGravity);
                        sloppy.velocity.y += currentGravity * beatMultiplier;
                    }

                    // 2. Update position
                    sloppy.x += sloppy.velocity.x * beatMultiplier;
                    sloppy.y += sloppy.velocity.y * beatMultiplier;
                    
                    // 3. Handle collisions and update potential
                    // X-axis collisions (walls)
                    if (sloppy.x <= 0 || sloppy.x >= window.innerWidth - 80) {
                        sloppy.velocity.x *= -0.8; 
                        sloppy.x = Math.max(0, Math.min(window.innerWidth - 80, sloppy.x));
                        sloppy.bouncePotential *= this.WALL_HIT_POTENTIAL_DECAY_FACTOR;
                    }
                    
                    // Y-axis collisions (ground/ceiling)
                    if (sloppy.y >= window.innerHeight - 80) { // Ground collision
                        sloppy.y = window.innerHeight - 80; 
                        const impactVelocity = Math.abs(vy_before_physics_update);

                        if (!sloppy.onGround && impactVelocity > 0.1) { // Just landed
                            sloppy.bouncePotential = Math.min(this.MAX_BOUNCE_POTENTIAL, 
                                sloppy.bouncePotential + 
                                impactVelocity * this.IMPACT_POTENTIAL_GAIN_VELOCITY_FACTOR + 
                                bassLevel * this.IMPACT_POTENTIAL_GAIN_BASS_FACTOR);
                        }
                        sloppy.onGround = true;
                        
                        sloppy.velocity.y = -impactVelocity * this.RESTITUTION_GROUND; // Apply restitution
                        sloppy.velocity.y -= sloppy.bouncePotential * this.BOOST_FROM_POTENTIAL_FACTOR; // Add boost from potential
                        sloppy.velocity.y -= bassLevel * (this.BASS_BOOST_GROUND_BASE + sloppy.bouncePotential * this.BASS_BOOST_GROUND_POTENTIAL_FACTOR); // Add bass boost

                        // Ground impact splatter
                        if (impactVelocity > 0.1) { 
                            const numParticles = 3 + Math.floor(bassLevel * 15 + impactVelocity * 0.6);
                            for (let i = 0; i < numParticles; i++) {
                                const angle = -Math.PI / 2 + (Math.random() - 0.5) * (Math.PI * 0.75); 
                                const speed = 0.5 + Math.random() * 1.5 + impactVelocity * 0.20 + bassLevel * 1.8;
                                const pVx = Math.cos(angle) * speed;
                                const pVy = Math.sin(angle) * speed;
                                const size = 2 + Math.random() * (2 + audioLevel * 6 + sloppy.bouncePotential * 0.1);
                                const pColor = `rgba(${140 + Math.floor(Math.random()*65)}, ${40 + Math.floor(Math.random()*60)}, ${10 + Math.floor(Math.random()*40)}, ${0.7 + Math.random()*0.2})`;
                                const lifespan = 25 + Math.random() * 35;
                                this.particles.push(new Particle(sloppy.x + 40, sloppy.y + 75, pVx, pVy, size, pColor, lifespan));
                            }
                        }
                        // If almost resting on ground, decay potential
                        if (Math.abs(sloppy.velocity.y) < (0.3 + sloppy.bouncePotential * 0.015) && sloppy.onGround) {
                             sloppy.bouncePotential *= this.RESTING_POTENTIAL_DECAY;
                        }

                    } else if (sloppy.y <= 0) { // Ceiling collision
                        sloppy.velocity.y *= -0.6; 
                        sloppy.y = 0;
                        sloppy.onGround = false;
                        sloppy.bouncePotential *= this.CEILING_HIT_POTENTIAL_DECAY_FACTOR;
                    } else { // Airborne
                        sloppy.onGround = false;
                        if (sloppy.bouncePotential > 0) {
                           sloppy.bouncePotential *= this.AIRBORNE_POTENTIAL_DECAY;
                        }
                    }
                    
                    sloppy.rotation += sloppy.rotationSpeed * beatMultiplier;
                    
                    const beatScale = 1 + (audioLevel * 0.2); // Reduced base audio scale slightly
                    const potentialVisualScale = 1 + (sloppy.bouncePotential / this.MAX_BOUNCE_POTENTIAL) * this.POTENTIAL_SCALE_FACTOR;
                    
                    sloppy.element.style.left = sloppy.x + 'px';
                    sloppy.element.style.top = sloppy.y + 'px';
                    
                    let transformStyle = `rotate(${sloppy.rotation}deg) scale(${beatScale * potentialVisualScale})`;
                    if (this.rainbowEffectActive) {
                        sloppy.element.style.filter = `hue-rotate(${this.rainbowHueAngle}deg) drop-shadow(0 0 5px hsl(${this.rainbowHueAngle}, 100%, 70%))`;
                    } else {
                        sloppy.element.style.filter = 'none';
                    }
                    sloppy.element.style.transform = transformStyle;
                    
                    // Dampen velocities (air resistance like)
                    sloppy.velocity.x *= 0.998;
                    if (!sloppy.onGround) { // Only dampen Y if not on ground
                        sloppy.velocity.y *= 0.998;
                    }


                    // Rhythmic Drips (existing logic)
                    if (Math.random() < audioLevel * 0.20 + 0.005) { 
                        const numDrips = 1 + Math.floor(audioLevel * 1.5);
                        for (let j = 0; j < numDrips; j++) {
                            const dripVx = (Math.random() - 0.5) * 0.8;
                            const dripVy = Math.random() * 0.8 + 0.3;
                            const dripSize = 1.5 + Math.random() * (2 + audioLevel * 4 + sloppy.bouncePotential * 0.08); // Drip size can also be affected by potential
                            
                            const ageSeconds = (Date.now() - sloppy.creationTime) / 1000;
                            const ageFactor = Math.min(1, ageSeconds / 45); 
                            const baseRed = 170 - ageFactor * 40; 
                            const baseGreen = 70 - ageFactor * 20;
                            
                            const dripColor = `rgba(${Math.floor(baseRed + Math.random()*35)}, ${Math.floor(baseGreen + Math.random()*30)}, ${30 + Math.floor(Math.random()*20)}, ${0.6 + Math.random()*0.3})`;
                            const dripLifespan = 30 + Math.random() * 40;
                            this.particles.push(new Particle(
                                sloppy.x + 20 + Math.random() * 40, 
                                sloppy.y + 65 + Math.random() * 15,
                                dripVx, dripVy, dripSize, dripColor, dripLifespan
                            ));
                        }
                    }
                });
                
                requestAnimationFrame(() => this.animate());
            }
        }

        window.addEventListener('load', () => {
            new SloppyJoeExperience();
        });
    </script>
